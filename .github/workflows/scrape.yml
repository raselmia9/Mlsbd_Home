name: MLSBD Scraper

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *' # প্রতি ৬ ঘণ্টা পর পর অটোমেটিক রান হবে (আপনার প্রয়োজনমতো পরিবর্তন করতে পারেন)
  workflow_dispatch: # ম্যানুয়ালি রান করার অপশন

jobs:
  scrape:
    runs-on: ubuntu-latest

    permissions:
      contents: write # গিট রিপোজিটরিতে ফাইল কমিট ও পুশ করার পারমিশন

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 cloudscraper
          # যদি প্লে-রাইট বা অন্য কিছু দরকার হয় পরে এখানে যোগ করা যাবে

      - name: Run Scraper Script
        run: |
          python scraper.py

      - name: Commit and Push Results
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add status.txt multilink.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update scraped data: $(date +'%Y-%m-%d %H:%M:%S')" && git push)
          
